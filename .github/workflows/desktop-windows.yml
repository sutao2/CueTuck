name: desktop-windows

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing source tag or commit to package (blank uses workflow commit)
        required: false
        type: string
      retest_run:
        description: Re-test the installer from a completed Windows push run without rebuilding
        required: false
        type: string
  push:
    branches: [m1-desktop-skeleton, main]
    paths:
      - 'desktop/**'
      - 'shared/**'
      - 'scripts/release-check*'
      - 'scripts/windows-chrome-smoke.ps1'
      - 'scripts/windows-app-lock-smoke.ps1'
      - 'scripts/windows-portable.ps1'
      - 'LICENSE'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

jobs:
  retest:
    if: inputs.retest_run != ''
    runs-on: windows-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Identify the candidate
        id: candidate
        shell: pwsh
        env:
          RUN_ID: ${{ inputs.retest_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RUN_ID -notmatch '^\d+$') { throw 'Expected a numeric run ID' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUN_ID" | ConvertFrom-Json
          if ($run.event -ne 'push' -or $run.path -ne '.github/workflows/desktop-windows.yml' -or $run.status -ne 'completed' -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $run.head_branch -notin @('m1-desktop-skeleton','main')) { throw 'Expected a Windows packaging run on a release branch of this repository' }
          $artifact = if ($run.conclusion -eq 'success') { 'cuetuck-windows-nsis' } else { 'cuetuck-windows-diagnostic' }
          "name=$artifact" >> $env:GITHUB_OUTPUT
          Write-Host "Testing installer from $($run.head_sha)"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.name }}
          run-id: ${{ inputs.retest_run }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Exercise the installed application lock
        shell: pwsh
        run: |
          $files = @(Get-ChildItem candidate -Recurse -Filter '*-setup.exe')
          if ($files.Count -ne 1) { throw 'Expected one Windows x64 installer' }
          Write-Host "Installer SHA256: $((Get-FileHash $files[0].FullName).Hash)"
          $dir = Join-Path $env:RUNNER_TEMP 'cuetuck-retest'
          if ((Start-Process $files[0].FullName -ArgumentList @('/S',"/D=$dir") -Wait -PassThru).ExitCode -ne 0) { throw 'Installation failed' }
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--force-renderer-accessibility'
          try { ./scripts/windows-app-lock-smoke.ps1 -Executable (Join-Path $dir 'cuetuck.exe') }
          finally {
            if ((Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru).ExitCode -ne 0) { throw 'Uninstall failed' }
          }
  nsis:
    if: inputs.retest_run == ''
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PROMPTARK_API_BASE: https://prompt.likh.cn
      VITE_API_BASE: https://prompt.likh.cn
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true
      - name: Install frontend
        run: npm ci
      - name: Validate preview configuration
        run: node ../scripts/release-check.mjs --preview
      - name: Test Windows native code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The library test harness links the Tauri mock and menu stack but does not inherit the app EXE's Common Controls v6 manifest.
          $meta = cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $buildCrate = $meta.packages | Where-Object name -eq 'tauri-build'
          $manifest = Join-Path (Split-Path $buildCrate.manifest_path) 'src/windows-app-manifest.xml'
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $messages = cargo test --locked --manifest-path src-tauri/Cargo.toml --no-run --message-format=json-render-diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'Could not build Windows tests' }
          $testExe = $messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.target.name -eq 'cuetuck_lib' -and $_.executable -and $_.profile.test } | Select-Object -ExpandProperty executable -Unique
          if (@($testExe).Count -ne 1) { throw 'Expected one native library test executable' }
          & $mt.FullName -nologo -manifest $manifest "-outputresource:$testExe;#1"
          if ($LASTEXITCODE -ne 0) { throw 'Could not embed application manifest in Windows test harness' }
          # Run these exact executables. A second cargo test can relink the test harness and discard the manifest.
          $tests = $messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.executable -and $_.profile.test } | Select-Object -ExpandProperty executable -Unique
          Push-Location src-tauri
          try {
            foreach ($exe in $tests) {
              Write-Host "Running $exe"
              & $exe
              if ($LASTEXITCODE -ne 0) {
                Get-WinEvent -FilterHashtable @{LogName='System'; Id=26; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Message
                throw "Native test executable failed: $LASTEXITCODE"
              }
            }
            & $testExe --exact commands::clips::tests::password_clip_roundtrip_in_system_store --ignored
            if ($LASTEXITCODE -ne 0) { throw 'Windows credential store roundtrip failed' }
            cargo test --locked --doc
            if ($LASTEXITCODE -ne 0) { throw 'Windows doctests failed' }
          } finally { Pop-Location }
      - name: Build production-connected preview NSIS
        run: npx tauri build --bundles nsis --config src-tauri/tauri.preview.conf.json --ci
      - name: Package and smoke-test portable ZIP before installation
        shell: pwsh
        run: ../scripts/windows-portable.ps1
      - name: Verify binary, install, launch and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Resolve-Path 'src-tauri/target/release/cuetuck.exe'
          $bytes = [IO.File]::ReadAllBytes($binary)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) { throw 'Expected x64 PE' }
          if (-not [Text.Encoding]::UTF8.GetString($bytes).Contains($env:PROMPTARK_API_BASE)) { throw 'Production API missing from binary' }
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $installer = $installers[0]
          $installDir = Join-Path $env:RUNNER_TEMP 'promptark-preview-smoke'
          $install = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $app = $null
          $chromeError = $null
          try {
            $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--force-renderer-accessibility'
            $app = Start-Process (Join-Path $installDir 'cuetuck.exe') -PassThru
            Start-Sleep -Seconds 10
            $app.Refresh()
            if ($app.HasExited) { throw "Installed application exited early: $($app.ExitCode)" }
            Write-Host 'Installed x64 application remained running for 10 seconds.'
            if (Test-Path '../scripts/windows-chrome-smoke.ps1') {
              try { & ../scripts/windows-chrome-smoke.ps1 -App $app } catch { $chromeError = $_; Write-Warning $_ }
            }
            if (Test-Path '../scripts/windows-app-lock-smoke.ps1') {
              if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
              $app.WaitForExit()
              & ../scripts/windows-app-lock-smoke.ps1 -Executable (Join-Path $installDir 'cuetuck.exe')
            }
          } finally {
            if ($app -and -not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            $uninstaller = Join-Path $installDir 'uninstall.exe'
            if (Test-Path $uninstaller) {
              $uninstall = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
            } else { throw 'Uninstaller missing' }
          }
          New-Item -ItemType Directory -Force 'windows-artifact' | Out-Null
          Copy-Item $installer.FullName 'windows-artifact/'
          Copy-Item ($installer.FullName + '.sig') 'windows-artifact/'
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Add-Content -Encoding utf8NoBOM 'windows-artifact/SHA256SUMS-windows'
          @{ source_commit=(git rev-parse HEAD); api=$env:PROMPTARK_API_BASE; architecture='x64'; portable=(Get-Content 'windows-artifact/portable-info.json' -Raw | ConvertFrom-Json); installer=$installer.Name; sha256=$hash; smoke='install, launch 10s, uninstall'; authenticode=(Get-AuthenticodeSignature $installer.FullName).Status.ToString() } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM 'windows-artifact/build-info.json'
          Remove-Item 'windows-artifact/portable-info.json'
          if ($chromeError) { throw $chromeError }
      - name: Upload diagnostic package if an installation check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cuetuck-windows-diagnostic
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/windows-artifact/*portable.zip
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: cuetuck-windows-nsis
          path: desktop/windows-artifact/*
          if-no-files-found: error
