name: desktop-windows

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing source tag or commit to package (blank uses workflow commit)
        required: false
        type: string
  push:
    branches: [m1-desktop-skeleton, main]
    paths:
      - 'desktop/**'
      - 'shared/**'
      - 'scripts/release-check*'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

jobs:
  nsis:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PROMPTARK_API_BASE: https://prompt.likh.cn
      VITE_API_BASE: https://prompt.likh.cn
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install frontend
        run: npm ci
      - name: Validate preview configuration
        run: node ../scripts/release-check.mjs --preview
      - name: Test Windows native code
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build production-connected preview NSIS
        run: npx tauri build --bundles nsis --config src-tauri/tauri.preview.conf.json --ci
      - name: Verify binary, install, launch and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Resolve-Path 'src-tauri/target/release/cuetuck.exe'
          $bytes = [IO.File]::ReadAllBytes($binary)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) { throw 'Expected x64 PE' }
          if (-not [Text.Encoding]::UTF8.GetString($bytes).Contains($env:PROMPTARK_API_BASE)) { throw 'Production API missing from binary' }
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $installer = $installers[0]
          $installDir = Join-Path $env:RUNNER_TEMP 'promptark-preview-smoke'
          $install = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $app = $null
          try {
            $app = Start-Process (Join-Path $installDir 'cuetuck.exe') -PassThru
            Start-Sleep -Seconds 10
            $app.Refresh()
            if ($app.HasExited) { throw "Installed application exited early: $($app.ExitCode)" }
            Write-Host 'Installed x64 application remained running for 10 seconds.'
          } finally {
            if ($app -and -not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            $uninstaller = Join-Path $installDir 'uninstall.exe'
            if (Test-Path $uninstaller) {
              $uninstall = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
            } else { throw 'Uninstaller missing' }
          }
          New-Item -ItemType Directory -Force 'windows-artifact' | Out-Null
          Copy-Item $installer.FullName 'windows-artifact/'
          Copy-Item ($installer.FullName + '.sig') 'windows-artifact/'
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding utf8NoBOM 'windows-artifact/SHA256SUMS-windows'
          @{ source_commit=(git rev-parse HEAD); api=$env:PROMPTARK_API_BASE; architecture='x64'; installer=$installer.Name; sha256=$hash; smoke='install, launch 10s, uninstall'; authenticode=(Get-AuthenticodeSignature $installer.FullName).Status.ToString() } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM 'windows-artifact/build-info.json'
      - uses: actions/upload-artifact@v4
        with:
          name: cuetuck-windows-nsis
          path: desktop/windows-artifact/*
          if-no-files-found: error
