name: promptark
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Load images.env}
    environment:
      POSTGRES_DB: promptark
      POSTGRES_USER: promptark
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-promptark.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U promptark -d promptark']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
  redis:
    image: ${REDIS_IMAGE:?Load images.env}
    command: [redis-server, --maxmemory, 96mb, --maxmemory-policy, allkeys-lru, --save, '']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging
  minio:
    image: ${MINIO_IMAGE:?Load images.env}
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: [media:/data]
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
  minio-init:
    image: ${MC_IMAGE:?Load images.env}
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MEDIA_USER: ${MEDIA_USER:?Set MEDIA_USER}
      MEDIA_PASSWORD: ${MEDIA_PASSWORD:?Set MEDIA_PASSWORD}
    volumes: ['./minio-policy.json:/policy.json:ro']
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        for n in $$(seq 1 30); do
          mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && break
          sleep 2
        done
        mc mb --ignore-existing local/promptark-media >/dev/null
        mc anonymous set none local/promptark-media >/dev/null
        mc admin user add local "$$MEDIA_USER" "$$MEDIA_PASSWORD" >/dev/null
        mc admin policy create local promptark-media /policy.json >/dev/null
        mc admin policy attach local promptark-media --user "$$MEDIA_USER" >/dev/null
    restart: 'no'
    mem_limit: 256m
    logging: *logging
  api:
    image: promptark-api:${PROMPTARK_IMAGE_TAG:?Set image tag}
    build: { context: ../.., dockerfile: deploy/production/api.Dockerfile }
    environment:
      PROMPTARK_API_BIND: 0.0.0.0:8787
      PROMPTARK_DATABASE_URL: postgres://promptark:${DB_PASSWORD}@postgres:5432/promptark?sslmode=disable
      PROMPTARK_REDIS_URL: redis://redis:6379
      PROMPTARK_MEDIA_ENDPOINT: http://minio:9000
      PROMPTARK_MEDIA_BUCKET: promptark-media
      PROMPTARK_MEDIA_ACCESS_KEY: ${MEDIA_USER}
      PROMPTARK_MEDIA_SECRET_KEY: ${MEDIA_PASSWORD}
      PROMPTARK_OAUTH_KEY_FILE: /data/oauth.key
      PROMPTARK_OAUTH_WEB_MESSAGE_ORIGINS: https://prompt-admin.likh.cn
      PROMPTARK_ADMIN_EMAIL: ${ADMIN_EMAIL:?Set owner email}
      PROMPTARK_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set strong owner password}
      PROMPTARK_ALLOW_DEV_USER: '0'
      PROMPTARK_RESET_SCHEMA: '0'
      PROMPTARK_BILLING_MOCK: '1'
    ports: ['127.0.0.1:18787:8787']
    volumes: [keys:/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8787/v1/health | grep -q ''"postgres":true''']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    mem_limit: 384m
    security_opt: [no-new-privileges:true]
    logging: *logging
  admin:
    image: promptark-admin:${PROMPTARK_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: deploy/production/admin.Dockerfile
      args: { VITE_API_BASE: 'https://prompt-admin.likh.cn' }
    ports: ['127.0.0.1:15174:80']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 96m
    logging: *logging
volumes:
  postgres:
  media:
  keys:
