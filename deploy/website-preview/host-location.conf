    # Public website at the root; the existing catch-all still serves API routes.
    location = /preview { return 301 /; }
    location ^~ /preview/ { rewrite ^/preview/(.*)$ /$1 permanent; }
    location = / {
        proxy_pass http://127.0.0.1:15175;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/(?:assets/|data/|shared/|(?:index\.html|site\.css|landing\.css|site\.js|live-data\.mjs|robots\.txt|sitemap\.xml)$) {
        proxy_pass http://127.0.0.1:15175;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
