limit_req_zone $binary_remote_addr zone=promptark_auth:10m rate=10r/m;
server {
    listen 80;
    listen [::]:80;
    server_name prompt.likh.cn prompt-admin.likh.cn;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/promptark-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prompt.likh.cn;
    include /opt/cuetuck-website-preview/host-location*.conf;
    ssl_certificate /www/server/panel/vhost/cert/prompt.likh.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/prompt.likh.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    access_log /www/wwwlogs/prompt.likh.cn.log;
    error_log /www/wwwlogs/prompt.likh.cn.error.log;
    location = /v1/session {
        limit_req zone=promptark_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prompt-admin.likh.cn;
    ssl_certificate /www/server/panel/vhost/cert/prompt.likh.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/prompt.likh.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    access_log /www/wwwlogs/prompt-admin.likh.cn.log;
    error_log /www/wwwlogs/prompt-admin.likh.cn.error.log;
    location = /v1/session {
        limit_req zone=promptark_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:15174;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:15174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
