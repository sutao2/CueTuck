openapi: 3.0.3
info:
  title: PromptArk Admin
  version: 0.1.0
  description: M6 管理合同。不把本路径写进 square.yaml。本仓库 backend 是预发，不声称生产。
paths:
  /v1/admin/me:
    get:
      operationId: getAdminMe
      summary: 当前管理员身份与角色
  /v1/admin/publications:
    get:
      operationId: listAdminPublications
      summary: 待审发布列表
  /v1/admin/publications/{id}/approve:
    post:
      operationId: approvePublication
      summary: 通过审核
      description: 审核状态与上架原子提交；重复通过成功且不重复上架；已驳回返回 409
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /v1/admin/publications/{id}/reject:
    post:
      operationId: rejectPublication
      summary: 驳回审核
      description: 重复驳回成功；已通过返回 409，不允许覆盖相反审核结果
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /v1/admin/users:
    get:
      operationId: listAdminUsers
      summary: 用户只读列表
  /v1/admin/settings:
    get:
      operationId: getAdminSettings
      summary: 运行时设置
    put:
      operationId: putAdminSettings
      summary: 保存运行时设置
  /v1/admin/oauth:
    get:
      operationId: listAdminOAuthProviders
      summary: 读取 Google 与 GitHub 的脱敏配置（仅管理员）
      responses:
        '200':
          description: 不返回 Client Secret 或密文
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthProviderView'
        '401':
          description: 未登录
        '403':
          description: 非管理员
  /v1/admin/oauth/{provider}:
    put:
      operationId: updateAdminOAuthProvider
      summary: 保存提供商配置并立即生效
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, client_id, redirect_uri]
              properties:
                enabled:
                  type: boolean
                client_id:
                  type: string
                  maxLength: 1024
                client_secret:
                  type: string
                  maxLength: 4096
                  writeOnly: true
                  description: 空白或省略保留原密钥；启用时必须已有或提交密钥
                redirect_uri:
                  type: string
                  maxLength: 2048
                  description: HTTPS，loopback 可用 HTTP；以 /v1/session/oauth/callback 结尾，无用户信息、查询参数或片段
      responses:
        '200':
          description: 保存成功（不代表真实授权已验收）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderView'
        '400':
          description: 字段或提供商无效；JSON message 为错误提示
        '401':
          description: 未登录
        '403':
          description: 非管理员
        '500':
          description: 配置持久化或密钥解密失败，不返回敏感内容
components:
  schemas:
    OAuthProviderView:
      type: object
      required: [provider, enabled, client_id, redirect_uri, secret_configured, source]
      properties:
        provider:
          type: string
          enum: [google, github]
        enabled:
          type: boolean
        client_id:
          type: string
        redirect_uri:
          type: string
        secret_configured:
          type: boolean
        source:
          type: string
          enum: [database, environment, none]
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
  - bearer: []
