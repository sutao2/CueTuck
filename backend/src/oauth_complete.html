<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>授权完成 · 提示方舟</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #22342f; background: #f5f7f6; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(440px, calc(100% - 40px)); padding: 40px 32px; border: 1px solid #dfe7e2; border-radius: 20px; background: #fff; }
    .brand { margin: 0 0 28px; color: #537367; font-size: 14px; }
    .check { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: #e6f4ec; color: #237a53; font-size: 24px; }
    h1 { margin: 20px 0 12px; font-size: 26px; }
    p { line-height: 1.7; }
    .hint { margin: 24px 0 0; color: #6b7a73; font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      :root { color: #e4ece7; background: #141b18; }
      main { background: #1d2722; border-color: #34463c; }
      .brand, .hint { color: #a5b8ac; }
      .check { background: #253f31; color: #8bd4a9; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">提示方舟 · PromptArk</p>
    <div class="check" aria-hidden="true">✓</div>
    <h1>授权完成</h1>
    <p>请切回提示方舟，客户端会自动完成登录。</p>
    <p class="hint">可以关闭此页面。若客户端已取消或等待超时，请从客户端重新发起登录。</p>
  </main>
</body>
</html>
