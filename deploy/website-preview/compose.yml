name: cuetuck-website-preview
services:
  website:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports: ['127.0.0.1:15175:80']
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '2' }
