proxy_cache_path /var/cache/nginx/releases keys_zone=cuetuck_releases:1m max_size=4m inactive=1h;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cms-assets.youmind.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control 'no-cache';
    location = /data/desktop-releases.json {
        limit_except GET { deny all; }
        proxy_pass https://api.github.com/repos/sutao2/CueTuck/releases?per_page=100;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent CueTuck-Release-Feed;
        proxy_set_header Accept application/vnd.github+json;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 12s;
        proxy_cache cuetuck_releases;
        proxy_cache_key desktop-releases;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 5m;
    }
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
