openapi: 3.0.3
info:
  title: PromptArk Square
  version: 0.1.0
  description: M5 广场合同。旧 Spring 路径不是本合同。
paths:
  /v1/square/items:
    get:
      operationId: listSquareItems
      security: []
      summary: 浏览广场（匿名）
  /v1/square/items/{id}:
    get:
      operationId: getSquareItem
      security: []
      summary: 广场条目详情（匿名）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /v1/square/items/{id}/content:
    get:
      operationId: getSquareItemContent
      security: []
      summary: 下载正文（匿名）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /v1/session:
    post:
      operationId: createSession
      security: []
      summary: 邮箱密码登录
    delete:
      operationId: deleteSession
      summary: 退出
  /v1/session/refresh:
    post:
      operationId: refreshSession
      security: []
      summary: 用 Refresh 轮换 Access 与 Refresh；旧对失效
  /v1/favorites:
    get:
      operationId: listFavorites
      summary: 已登录收藏列表
  /v1/favorites/{id}:
    put:
      operationId: putFavorite
      summary: 收藏
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: deleteFavorite
      summary: 取消收藏
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /v1/publications:
    post:
      operationId: createPublication
      summary: 提交审核；可带 title 与 content 快照，通过后进入广场列表
  /v1/health:
    get:
      operationId: health
      security: []
      summary: Postgres / Redis / MinIO 是否可达
  /v1/session/oauth/providers:
    get:
      operationId: listOAuthProviders
      security: []
      summary: 已配置的 Google / GitHub
  /v1/session/oauth/callback:
    get:
      operationId: oauthCallback
      security: []
      summary: OAuth 授权码回调
  /v1/session/oauth/session/{flowId}:
    get:
      operationId: oauthBrowserSession
      security: []
      summary: 浏览器 OAuth 轮询
      parameters:
        - name: flowId
          in: path
          required: true
          schema:
            type: string
  /v1/session/oauth/{provider}:
    get:
      operationId: startOAuth
      security: []
      summary: 跳转 Google 或 GitHub 授权
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
  /v1/media/upload:
    post:
      operationId: uploadMedia
      summary: 登录后上传对象到 MinIO
  /v1/media/{id}/url:
    get:
      operationId: mediaUrl
      security: []
      summary: 对象预签名 GET
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
  - bearer: []
