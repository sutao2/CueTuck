openapi: 3.0.3
info:
  title: PromptArk Square
  version: 0.1.0
  description: M5 广场合同。旧 Spring 路径不是本合同。条目列表、详情和正文可含 reference（可空对象），字段 repository、url、author、license、license_url、images（HTTPS URL 数组）；历史记录为空，普通投稿不可自行写入此导入来源字段。
paths:
  /v1/skills:
    get:
      operationId: browseCommunitySkills
      security: []
      summary: 浏览已通过审核的社区 Skill
      description: 仅返回 approved 且作者未停用的条目。关闭匿名浏览时须有效 Access。q 最多 500 字节，category 为 development/ai/cloud/security/office/design/marketing/science/tools/uncategorized，status 可为 pending/approved/rejected/withdrawn，空值不筛选；offset 为 0–100000。每页 24 条，按 created_at 倒序及 id 排序；返回 items、total、offset、category_counts（当前可见范围、筛选前的分类计数）。摘要含 id/title/description/category/license/name/digest/status/reason/created_at/publisher.display_name，不含包字节或作者邮箱。非法筛选 400、未登录 401、未配置数据库 503。
    post:
      operationId: submitCommunitySkill
      summary: 登录用户提交完整 Skill 包
      description: JSON 含 request_id（UUID）、title（非空最多 120 字）、description（非空最多 2000 字）、category、license（非空最多 120 字）、confirm_public=true、bundle；拒绝未知字段。bundle 为 name 和 files 数组，每文件含 path、Base64 content、executable；包路径及大小校验见 Skills 规格，整请求上限 36 MiB。须已设置公开昵称且站点允许投稿；普通账号受发布策略的 24 小时额度限制，admin/owner 豁免个人额度。同账号 request_id 与完全相同内容重试复用原稿，不同内容 409。新稿 pending，启用 AI 决策时入队；返回与详情相同的对象，不承诺立即公开。校验失败 400、关闭投稿 403、缺昵称 422、额度超限 429。
  /v1/skills/mine:
    get:
      operationId: listMyCommunitySkills
      summary: 登录用户分页查看本人 Skill 投稿
      description: 查询参数、分页和摘要结构同 GET /v1/skills；可见范围为本人全部状态，分类计数也仅含本人。不返回其他作者的未公开稿件；未登录 401。
  /v1/skills/{id}:
    get:
      operationId: getCommunitySkill
      security: []
      summary: 读取可见 Skill 的正文和文件清单
      description: 已批准且作者未停用的稿件按广场匿名开关访问；未公开稿件仅本人或管理角色可读，非公开请求无会话为 401、无权查看为 404。返回摘要、history（status/reason/at）、body（SKILL.md 文本）、files（path/size/executable），不返回包字节。不存在 404、存量包校验失败 500。
  /v1/skills/{id}/bundle:
    get:
      operationId: getCommunitySkillBundle
      security: []
      summary: 获取可见 Skill 的完整包与摘要
      description: 权限同 Skill 详情；返回 bundle（name/files，文件含 path/Base64 content/executable）与 digest。仅交付数据，不执行脚本或安装到本机；不记录提示词下载计数。
  /v1/skills/{id}/withdraw:
    post:
      operationId: withdrawMyCommunitySkill
      summary: 作者撤回自己的 Skill 投稿
      description: 须有效 Access。JSON 必须含 status、expected_status，可选 reason（最多 2000 字），拒绝未知字段；服务端将目标状态固定为 withdrawn，忽略 status 的值。仅作者可操作，非本人或不存在 404；当前状态与 expected_status 不同或已撤回为 409。状态、history 与审计同事务；返回 id/status。
  /v1/square/items/{id}/translations:
    get:
      operationId: getSquareTranslations
      security: []
      summary: 读取公开提示词当前源文的语言版本
      description: 沿用广场匿名开关；关闭时须有效 Access，不存在或非 online 为 404。返回按 zh/en 索引的对象，无版本时为空对象；各版本含 status、version、error。version 可含 title/content/members/excerpt/source/source_hash/model/rule；排队或失败时可为空。源文变化使旧版本失效，读取不创建任务、不增加下载/收藏计数。
  /v1/square/items/{id}/translations/{target}:
    post:
      operationId: enqueueSquareTranslation
      summary: 登录用户请求生成 zh 或 en 版本
      description: 无请求体；target 仅 zh/en，否则 400，条目须 online。返回与 GET translations 相同的版本对象。ready/queued/running 复用，failed 可重新入队；服务未启用时未就绪请求为 503。普通账号、reviewer/support 每个数据库自然日最多 20 次新建或重启，admin/owner 按当前角色豁免个人次数；创建任务与计数同事务，超限 429 不遗留任务。保留账号频控、全站 token 预算与供应商速率约束；不改原稿、不执行同步或下载。
  /v1/square/browse:
    get:
      operationId: browseSquarePage
      security: []
      summary: 桌面广场有界滚动分页
      x-recommendation: recommendation 可选 1–64 位字母/数字/连字符种子，省略为服务端小时种子。推荐响应返回同名字段，续页沿用；筛选与语言必须一致。两小时有界快照冻结 ID 顺序和 total，新发布不加入本轮，下架实时排除且不挤移分页位置；空 items 可有 next_offset。续页快照缺失返回 409，要求从首批重新加载。仅推荐使用快照，最新/热门/收藏保持各自排序。
      x-category-counts: offset=0 时附带 category_counts（直接分类 ID 到 online 数量，空字符串表示无分类）及 category_total（包含无分类），忽略搜索/模型/分类/收藏筛选；数据库单次 GROUP BY 聚合，不读取全量列表。续页两字段均为 null；父级按 catalog.category_parents 汇总直接计数与子级，不重复计数。
      description: sort 为 recommended/latest/hot/favorites（或中文对应标签），q 为标题/摘要/作者字面搜索（最多 1200 字节），model/category_id 最多 200 字节，大分类含一级子分类。limit 默认及最大 48，offset 默认 0、0–100000。只返回 online；数据库筛选、稳定 id 次排序及计数，返回 items,total,limit,offset,next_offset（末页 null）。条目只含 id/title/kind/excerpt/model/category_id/member_count/is_favorite/download_count/favorite_count/reference；download_count 是已记录匿名下载次数，favorite_count 是当前收藏账号数（按条目索引聚合）；标题最多 160 字、摘要 240 字，reference 仅含一张最多 2048 字符封面 URL，不含正文、成员或完整来源。收藏查询及关闭匿名时须有效 Access，否则 401；非法参数 400，依赖失败或查询超时 503。旧 items 和 MCP search 保持兼容。
  /v1/square/search:
    get:
      operationId: searchPublicSquare
      security: []
      summary: 智能体及只读消费者的有界广场检索
      description: q 为标题/摘要字面关键词，最多 1200 字节，百分号及下划线非通配；category_id 含一级子分类，model 精确匹配，各最多 200 字节。limit 默认 20、1–100，offset 默认 0、0–100000；非法参数 400。按 title/id 稳定排序且只含 online，响应 items（id/title/kind/excerpt/category_id/model）、limit、offset、next_offset（末页 null）。数据库限量读取，不返回全部正文/成员。站点禁止匿名时无有效 Access 为 401，依赖故障或查询超时 503；不记统计、不改既有 items 接口。
  /v1/square/items/{id}/assets/{asset_id}:
    get:
      operationId: getPublicPublicationAsset
      security: []
      summary: 按公开稿件可见性代理附件字节
      description: id 为稿件/广场条目 ID，asset_id 为投稿中选中的附件 UUID。要求 publication approved、square_items online、对象 ready 且归属于作者；不满足为 404。站点禁匿名时须有效 Access，否则 401；传输前后重新验证。大小/类型/SHA-256 校验失败为 502。返回 attachment、nosniff、no-store，不提供签名存储 URL，不扩大私有媒体 API 权限。
  /v1/site:
    get:
      operationId: getPublicSiteConfiguration
      security: []
      summary: 公开社区名称、说明、HTTPS 标识、支持邮箱、投稿开关和当前有效公告
      description: 返回公开站点字段与 revision，不含 SMTP/OAuth/账号信息；公告未开始或已到期返回空正文。广场 catalog.site 返回相同字段。关闭投稿时直接 POST publications 也返回 403，不影响本地库与已有投稿审核。
  /v1/reports:
    get:
      operationId: listMyReports
      summary: 登录用户读取本人举报进度
      description: offset 0–100000，每页 25。返回 items,total,offset,limit；每项 id,target_id,category,reason,status,resolution,created_at,updated_at。不含管理员邮箱、内部历史或其他举报者。
    post:
      operationId: reportSquareContent
      summary: 举报在线广场提示词或合集
      description: JSON target_id（最多 200 字节）、category（privacy/medical/financial/copyright/danger/spam/other）、reason（非空最多 1000 字）。须有效用户 Access。同人同目标未结案去重返回相同 id/status；每 24 小时最多 20 个新案件，超限 429。目标不存在或不可见 404；账号禁用/令牌撤销不能提交。举报不自动下架，不读取本地内容。
  /v1/square/catalog:
    get:
      operationId: getSquareCatalog
      security: []
      summary: 广场分类和模型公共字典
      x-category-parents: category_parents 为所有未删除分类的 ID 到父 ID（根为 null）映射，包含停用项，仅用于既有内容和收藏的父级筛选，不作为新投稿选项。
      description: 返回 categories/models 数组，每项含 id、name、排序等公开元数据；不包含引用计数或秘密。只返回启用且未删除的项，停用父级不返回其子级。分类用于广场筛选和投稿，模型 id 对应提示词 model 值。字典公开不等于允许匿名访问正文。
  /v1/square/items:
    get:
      operationId: listSquareItems
      security: []
      summary: 浏览广场（匿名）
      description: 仅返回 online 内容；关闭匿名浏览后访客列表为空，已登录仍可读。recommended 推荐优先再按权重/id；latest 按首次上架时间倒序，旧条目无时间置后；hot 仍按匿名下载计数。数据库错误不当作成功空列表。
      parameters:
        - name: category_id
          in: query
          description: 系统大分类含其小分类；小分类精确匹配；省略返回全部
          schema:
            type: string
  /v1/square/items/{id}:
    get:
      operationId: getSquareItem
      security: []
      summary: 广场条目详情（匿名）
      description: 下架/回收站与不存在均 404；关闭匿名浏览时须有效 Access，否则 401。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /v1/square/items/{id}/content:
    get:
      operationId: getSquareItemContent
      security: []
      summary: 下载正文（匿名）
      description: 返回 id、title、kind、content、category_id、model、members、asset_refs；members 为合集成员快照数组（title、content、category_id、model、可选 asset_ids），普通提示词为空数组。asset_refs 为已批准投稿的附件清单，字段 id、media_id、name、mime、size、sha256，旧记录为空数组；合集通过成员 asset_ids 关联清单，每文件恰属于一个成员。字节只通过本条目附件代理读取。历史条目分类与模型可为 null。下架/回收站 404；关闭匿名浏览时须有效 Access，否则 401。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /v1/square/items/{id}/downloads:
    post:
      operationId: recordSquareDownload
      security: []
      summary: 匿名下载计数（不要求登录；不记录账号）
      description: 仅在线条目可增加计数；下架/回收站与不存在均 404。新客户端未设置偏好时默认上报，显式关闭仍不请求。
      responses:
        '200':
          description: 已原子递增的实际次数；旧客户端仍可按成功状态处理。
          content:
            application/json:
              schema:
                type: object
                required: [download_count]
                properties:
                  download_count:
                    type: integer
                    format: int64
                    minimum: 1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /v1/session:
    post:
      operationId: createSession
      security: []
      summary: 邮箱密码登录
      description: 60 秒内全实例 300 次、同连接 IP 60 次、同邮箱 10 次尝试；超额返回 429 和 Retry-After=60，不区分邮箱是否存在；限流存储不可用返回 503。
    delete:
      operationId: deleteSession
      summary: 退出
  /v1/session/refresh:
    post:
      operationId: refreshSession
      security: []
      summary: 用 Refresh 轮换 Access 与 Refresh；旧对失效
  /v1/session/identity/options:
    get:
      operationId: getIdentityOptions
      security: []
      summary: 公开注册策略和邮件是否可用，不返回凭据
      description: 返回 registration_open、email_enabled；没有 SMTP 时邮箱注册/重置不可用，但已有账号仍可登录。
  /v1/session/identity/request:
    post:
      operationId: requestIdentityVerification
      security: []
      summary: 请求注册或密码重置验证邮件
      description: JSON kind（registration/reset）、email。符合条件时入队加密邮件；不符合账号条件仍统一 202 message，不返回验证码、账号是否存在或投递 ID。无 SMTP 统一 503；注册关闭 403；格式错误 400/422；认证频控 429，每邮箱每天最多 5 封挑战邮件。重发使同目的旧码失效。
  /v1/session/identity/confirm:
    post:
      operationId: confirmIdentityVerification
      security: []
      summary: 消耗一次性验证凭据并设置密码，不自动登录
      description: JSON kind（registration/reset/invitation）、email、token（64 位十六进制）、new_password（12–128 字符）。凭据 30 分钟有效；无效/已用/过期/撤销统一 400；成功返回 status=verified 和 message，不发令牌。只有邮箱验证完成后创建账号；重置则撤销全部旧会话。账号、凭据消费与审计同事务。
  /v1/me:
    get:
      operationId: getMe
      summary: 当前账号显示名与简介
    put:
      operationId: putMe
      summary: 保存显示名与简介
  /v1/billing/status:
    get:
      operationId: getBillingStatus
      summary: 当前账号是否 Pro；无支付密钥时说明支付未开通
  /v1/billing/redeem:
    post:
      operationId: redeemBillingCode
      summary: 提交兑换码升 Pro；作废码失败且不改状态
  /v1/billing/checkout:
    post:
      operationId: startBillingCheckout
      summary: 仅在 Stripe 测试密钥下给出 Checkout；无密钥说明支付未开通
      description: 显式 mock 模式不调用 Stripe；JSON mock_outcome（success/failure/cancel/reset）、request_id（可选 UUID，新客户端重试必须复用）。Postgres 中独立保存模拟权益和订单，真实 pro 不变；同账号同 ID 同参数幂等，不同参数冲突；返回 mock/mock_pro/pro/note/checkout_url=null。
  /v1/billing/mock/redeem:
    post:
      operationId: redeemMockCode
      summary: 登录用户兑换 TEST 前缀测试码，仅模拟权益
      description: JSON code（TEST- 加 32 位十六进制）、request_id（可选 UUID，新客户端必须发送并在重试时复用）。须后端启用 mock，独立于真实兑换表；同人同码最多一次，过期/停用/额度用尽拒绝，事务内配额检查、订单/模拟权益与审计原子一致。成功返回标准 BillingStatus，pro 仍是真实值，只有 mock_pro 可改变。
  /v1/billing/webhook:
    post:
      operationId: receiveBillingWebhook
      security: []
      summary: 校验 Stripe 签名后把已完成 Checkout 记成 Pro
  /v1/library/changes:
    get:
      operationId: listLibraryChanges
      summary: 拉取账号库变更
      description: since 按 Unix 时间比较，兼容旧秒值与新毫秒值；返回包含软删除的记录。
    put:
      operationId: putLibraryChanges
      summary: 推送账号库变更
      description: 支持 prompt、collection、category、setting；payload 为对象，updated_at 为非负整数字符串，按归一化后的时间较新者胜。prompt 可带 asset_refs 数组，每项 id（本地附件 UUID）、media_id、name、mime、size、sha256，最多 12 项 / 20 MiB；全部元数据须匹配当前账号 ready 私有媒体，否则整批拒绝（404，不泄露他人对象）。不接受原始 assets 文件字节；其他 kind 不接受 asset_refs。正文更新省略 asset_refs 时保留服务器已有引用。非法格式 400、数量/总量超限 413。
  /v1/favorites:
    get:
      operationId: listFavorites
      summary: 已登录收藏列表
  /v1/favorites/{id}:
    put:
      operationId: putFavorite
      summary: 收藏
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      operationId: deleteFavorite
      summary: 取消收藏
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /v1/publications:
    post:
      operationId: createPublication
      summary: 提交审核；可带 title、content、category_id、model 快照，通过后进入广场列表
      description: kind 省略为 prompt；collection 必须传非空 members（每项 title、content 非空，可带系统 category_id、model、asset_ids），成员不传本地成员 ID。category_id 必须为系统分类 ID；自定义小分类由客户端映射至所属系统大分类；未知分类或非法快照返回 400。prompt 和 collection 均可带显式选择的 asset_refs（id、media_id、name、mime、size、sha256）；旧客户端省略为空数组。合集成员 asset_ids 必须恰好覆盖清单且不得重复、未知或遗漏，否则 400。整稿最多 12 个、总量 20 MiB，全部引用须匹配本账号 ready 私有对象，否则 404；非法格式 400、超限 413。带附件稿件必须人工审核，文本规则和 AI 不可自动批准；未选文件不在稿件访问范围。
  /v1/publications/mine:
    get:
      operationId: listMyPublications
      summary: 当前账号投稿与审核状态
      description: 返回 items，仅含当前账号投稿，每条含 download_count（已记录下载次数）和 favorite_count（当前收藏账号数）；未上架为 0，下架保留历史统计；Postgres 模式包含 created_at（旧投稿可能 null）、visibility（online/offline/trashed/null 未上架）和 history（id、publication_id、status、reason、created_at），不含审核人邮箱。作者可读取驳回理由和当前广场状态，内容仍是提交快照，不修改本地库。
  /v1/health:
    get:
      operationId: health
      security: []
      summary: Postgres / Redis / MinIO 是否可达
  /v1/session/oauth/providers:
    get:
      operationId: listOAuthProviders
      security: []
      summary: 已配置的 Google / GitHub
  /v1/session/oauth/callback:
    get:
      operationId: oauthCallback
      security: []
      summary: OAuth 授权码回调
      description: 普通登录沿用会话流程；browser 模式成功保存 flow 会话后返回 200 HTML 完成页（无凭据、no-store/no-referrer），客户端通过 flow 轮询取回会话，不返回 204。admin-test. 前缀 state 单独执行管理员发起的配置验证，随机一次性索引、10 分钟期限、配置/权限复核。验证返回固定 HTML，no-store/no-referrer，不返回令牌、不创建账号或会话；无效/重放 400，被新验证或配置替代 409。普通客户端无需发送或解析验证 state。
  /api/v1/auth/oauth/callback:
    get:
      operationId: oauthLegacyCallback
      security: []
      summary: 旧版 OAuth 回调路径兼容
      description: 与 /v1/session/oauth/callback 复用同一处理器；state 校验、普通登录、管理员验证和错误行为完全相同，不跳转到旧服务。
  /v1/session/oauth/session/{flowId}:
    get:
      operationId: oauthBrowserSession
      security: []
      summary: 浏览器 OAuth 轮询
      parameters:
        - name: flowId
          in: path
          required: true
          schema:
            type: string
  /v1/session/oauth/{provider}:
    get:
      operationId: startOAuth
      security: []
      summary: 跳转 Google 或 GitHub 授权
      description: Google 登录固定携带 prompt=select_account consent，请求明确选择账号并确认授权；只发起跳转不签发会话，尚无有效回调时轮询保持 pending。GitHub 不附加该参数。
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
  /v1/media/upload:
    post:
      operationId: uploadMedia
      summary: 登录后上传私有附件到 MinIO
      description: multipart 单个 file，单文件最多 5 MiB、整请求 6 MiB；文件名称/类型/内容必须匹配附件白名单。账号配额 256 个对象及 100 MiB，上传中预留也计入。同账号同文件名/类型/大小/SHA-256 的完成对象复用 id，不重复占配额；相同内容仍在上传中则 409，其他账号不复用。返回 id、name、mime、size、sha256、url（相对鉴权 API 路径，不是存储签名链接）；不公开、不自动关联提示词。参数错误 400、类型不支持 415、超限 413、配额不足 409、依赖不可用 503、存储传输失败 502。
  /v1/media/{id}/url:
    get:
      operationId: mediaUrl
      summary: 所有者获取私有附件 API 路径
      description: 必须有效 Access 且是所有者；其他账号（含管理员）、不存在或上传未完成均 404；无效会话 401。返回 url 为 /v1/media/{id}/content，访问仍需 Access，不产生预签名链接。旧缺元数据对象 409，不删除旧文件。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /v1/media/{id}/content:
    get:
      operationId: downloadPrivateMedia
      summary: 所有者下载已验证的私有附件字节
      description: 同 mediaUrl 的鉴权；后端限时代理并验证大小及 SHA-256，返回 attachment、nosniff、no-store，损坏或超限存储响应为 502。不接受远程 URL，不把存储响应头透传给客户端。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
  - bearer: []
